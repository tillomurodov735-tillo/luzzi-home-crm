<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luzzi Home — Parda Studiyasi CRM</title>
<style>
:root{
  /* Luzzi Home — premium: logotip terracotta (g'isht) + oltin + krem */
  --navy:#7c2d13; --navy-2:#4d1a08; --navy-3:#93401d; --navy-4:#a94a20;
  --sky:#c9a24c; --sky-soft:#f5ecd6;
  --bg:#f7f1e7; --card:#fffdf9; --line:#e9dcc6;
  --text:#3d2417; --muted:#8a6f55; --muted-2:#b39c80;
  --green:#2f8f5b; --green-bg:#e7f2ea; --red:#c0392b; --red-bg:#f7e4e1;
  --amber:#b3760c; --amber-bg:#f7ecd6; --violet:#9a6b2e; --violet-bg:#f2e7d3;
  --blue:#a56a1c; --blue-bg:#f3e8d1; --cyan:#3a7d8a; --cyan-bg:#e0eef0;
  --gold-grad:linear-gradient(135deg,#e9c56a 0%,#b8873a 100%);
  --r:14px;
  --shadow:0 1px 2px rgba(64,25,13,.07), 0 4px 16px rgba(64,25,13,.08);
  --shadow-lg:0 10px 44px rgba(64,25,13,.24);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#dcc9a5;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============ Sidebar ============ */
#sidebar{width:236px;min-width:236px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;display:flex;flex-direction:column;padding:22px 14px 16px;z-index:60;transition:transform .25s}
.logo{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700;letter-spacing:.3px;padding:0 6px;display:flex;align-items:center;gap:11px;color:#fff}
.logo .lh{color:var(--sky);font-weight:700}
.logo .mono{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:9px;background:linear-gradient(135deg,#7c2d13,#4d1a08);color:#e9c56a;font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:700;letter-spacing:1px;border:1px solid rgba(233,197,106,.45);box-shadow:0 3px 12px rgba(0,0,0,.4);flex-shrink:0}
.logo .mono::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:8px;background:#140905;box-shadow:0 0 0 .5px rgba(233,197,106,.35)}
.logo-sub{font-size:10px;color:#d7b578;padding:5px 10px 0 57px;letter-spacing:2px;text-transform:uppercase}
#nav{margin-top:26px;display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#e4d3b8;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;border:none;background:none;text-align:left;width:100%}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(201,162,76,.22);color:#fff;box-shadow:inset 3px 0 0 var(--sky)}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.nav-item .bdg{margin-left:auto;background:var(--sky);color:var(--navy-2);border-radius:20px;font-size:11px;font-weight:800;padding:1px 8px}
.side-spacer{flex:1}
.sync-pill{display:flex;align-items:center;gap:8px;font-size:12px;color:#c9b48f;padding:9px 12px;background:rgba(255,255,255,.06);border-radius:10px;margin-bottom:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0}
.dot.on{background:#35d492}.dot.err{background:#ff7b6e}
.prof-chip{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.06);cursor:pointer;border:none;width:100%;color:#fff;font-size:13px;font-weight:600}
.prof-chip:hover{background:rgba(255,255,255,.12)}
.ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.prof-chip small{display:block;color:#c9b48f;font-weight:500;font-size:11px}

/* ============ Main ============ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
#topbar{display:none;background:var(--navy);color:#fff;padding:12px 16px;align-items:center;gap:12px}
#topbar .logo{font-size:20px;padding:0}
.burger{background:none;border:none;color:#fff;font-size:22px}
#banner{background:var(--amber-bg);color:#7a4a00;border-bottom:1px solid #ecd9ae;padding:8px 24px;font-size:13px;display:none}
#banner.show{display:block}
#content{flex:1;overflow-y:auto;padding:24px 26px 40px}

.page-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:800}
.page-head .grow{flex:1}

.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-3)}
.btn-sky{background:var(--sky);color:var(--navy-2)}
.btn-sky:hover{background:#a1d4f4}
.btn-line{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn-line:hover{border-color:var(--navy-4)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-danger:hover{background:#fbd8d4}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}

/* ============ Cards / stats ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat .v{font-size:25px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.stat .l{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.stat .d{font-size:11.5px;margin-top:5px;color:var(--muted-2)}
.stat .v.green{color:var(--green)}
.stat .v.sky{color:var(--blue)}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:14.5px;font-weight:800;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
@media(max-width:1000px){.grid-2{grid-template-columns:1fr}}

/* funnel */
.fun-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.fun-name{width:130px;font-weight:600;color:var(--muted)}
.fun-track{flex:1;background:var(--bg);border-radius:6px;height:22px;overflow:hidden}
.fun-bar{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding:0 7px;color:#fff;font-size:11px;font-weight:800;min-width:4px;transition:width .4s}

/* chart */
.chart{display:flex;gap:8px;align-items:flex-end;height:150px;padding-top:10px}
.ch-m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.ch-bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.ch-bar{width:38%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px;transition:height .4s}
.ch-bar.a{background:var(--navy-4)}
.ch-bar.b{background:var(--sky)}
.ch-lbl{font-size:11px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* activity feed */
.feed{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow-y:auto}
.feed-it{display:flex;gap:11px;padding:9px 4px;border-bottom:1px solid var(--bg);font-size:13px}
.feed-it:last-child{border:none}
.feed-dot{width:7px;height:7px;border-radius:50%;background:var(--sky);margin-top:6px;flex-shrink:0}
.feed-it .t{color:var(--muted-2);font-size:11.5px;margin-top:2px}
.feed-it .by{color:var(--blue);font-weight:600}

/* ============ Toolbar ============ */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:180px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.toolbar input[type=search]:focus{border-color:var(--navy-4)}
.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;font-weight:600;color:var(--muted);max-width:170px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:none;padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}

/* ============ Kanban ============ */
.board{display:flex;gap:13px;overflow-x:auto;align-items:flex-start;padding-bottom:14px}
.col{background:#f0e6d3;border-radius:var(--r);min-width:256px;width:256px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 235px)}
.col-head{padding:12px 13px 6px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.col-head .bar{width:4px;height:15px;border-radius:2px}
.col-head .cnt{margin-left:auto;background:rgba(64,25,13,.1);border-radius:20px;padding:1px 9px;font-size:11.5px;font-weight:800}
.col-sum{padding:0 13px 8px;font-size:11px;color:var(--muted);font-weight:600}
.cards{padding:2px 9px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:56px}
.col.dragover{outline:2px dashed var(--navy-4);outline-offset:-4px}
.lead{background:var(--card);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;border-left:4px solid transparent;transition:.12s}
.lead:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(22,41,79,.13)}
.lead.dragging{opacity:.45}
.lead-top{display:flex;gap:9px;align-items:center}
.lead .nm{font-weight:700;font-size:13.5px;line-height:1.25}
.lead .co{font-size:12px;color:var(--muted);margin-top:1px}
.lead .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--sky-soft);color:var(--navy);font-weight:700}
.chip.svc{background:var(--violet-bg);color:var(--violet)}
.chip.money{background:var(--green-bg);color:var(--green)}
.chip.due{background:var(--red-bg);color:var(--red)}
.chip.owner{background:var(--amber-bg);color:var(--amber)}
.chip.src{background:var(--blue-bg);color:var(--blue)}
.lead .lost{font-size:11px;color:var(--red);margin-top:6px;font-style:italic}
.empty-col{font-size:12px;color:var(--muted-2);text-align:center;padding:12px 0}

/* ============ Table ============ */
.tbl-wrap{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{text-align:left;padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--bg);vertical-align:middle}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:var(--sky-soft)}
tbody tr:last-child td{border:none}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}

/* ============ Modal ============ */
#modalBg{position:fixed;inset:0;background:rgba(40,20,10,.55);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:36px 16px;overflow-y:auto}
#modalBg.show{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:540px;padding:24px;box-shadow:var(--shadow-lg);animation:pop .18s}
.modal.wide{max-width:620px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.m-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.m-head h2{font-size:17px;flex:1}
.m-x{background:var(--bg);border:none;border-radius:8px;width:30px;height:30px;font-size:15px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy-4)}
.field textarea{resize:vertical;min-height:60px}
.m-actions{display:flex;gap:10px;margin-top:16px;align-items:center}
.m-actions .grow{flex:1}

/* lead detail */
.ld-head{display:flex;gap:13px;align-items:center;margin-bottom:14px}
.ld-head .ava{width:46px;height:46px;font-size:17px}
.ld-head .nm{font-size:17px;font-weight:800}
.ld-head .co{font-size:13px;color:var(--muted)}
.ld-info{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;background:var(--bg);border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px}
.ld-info b{display:block;font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;margin-bottom:1px}
.ld-info a{color:var(--blue);text-decoration:none;font-weight:600}
.tl{max-height:210px;overflow-y:auto;margin-top:6px}
.tl-it{display:flex;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.tl-it:last-child{border:none}
.tl-n{width:20px;height:20px;border-radius:50%;background:var(--sky-soft);color:var(--navy);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.tl-it .t{color:var(--muted-2);font-size:11px}
.note-row{display:flex;gap:8px;margin-top:10px}
.note-row input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:10px;outline:none}

/* chips editor (settings) */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chips .ch{background:var(--sky-soft);color:var(--navy);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.chips .ch button{background:none;border:none;color:var(--muted);font-size:13px;padding:0}
.chips .ch button:hover{color:var(--red)}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.set-grid{grid-template-columns:1fr}}

/* stages editor */
.st-row{display:flex;gap:9px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bg)}
.st-row input[type=color]{width:38px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer;flex-shrink:0}
.st-name{flex:1;padding:7px 11px;border:1px solid var(--line);border-radius:9px;outline:none;font-weight:600;min-width:0}
.st-name:focus{border-color:var(--navy-4)}
.st-cnt{font-size:11.5px;color:var(--muted-2);white-space:nowrap;min-width:38px;text-align:right}
.st-btn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--muted);font-size:13px;flex-shrink:0}
.st-btn:hover:not(:disabled){border-color:var(--navy-4);color:var(--navy)}
.st-btn:disabled{opacity:.35;cursor:default}
.st-del:hover{border-color:var(--red)!important;color:var(--red)!important}
.st-lock{font-size:14px;padding:0 8px}
.tm-role{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;font-weight:600;color:var(--muted);flex:0 0 100px}
.tm-pin{flex:0 0 110px;width:110px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;outline:none}
.tm-pin:focus,.tm-role:focus{border-color:var(--navy-4)}
/* login */
.login-role{display:flex;gap:8px;margin-bottom:12px}
.login-role button{flex:1;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:700;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.login-role button.on{border-color:var(--navy);background:var(--sky-soft);color:var(--navy)}
.login-role button .ava{width:32px;height:32px;font-size:12px}
/* tasks */
.task-it{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--bg);align-items:flex-start}
.task-it:last-child{border:none}
.tk-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;color:transparent;font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px;transition:.15s}
.tk-check:hover{border-color:var(--green)}
.tk-check.on{background:var(--green);border-color:var(--green);color:#fff}
.tk-body{flex:1;cursor:pointer;min-width:0}
.tk-title{font-weight:700;font-size:14px}
.tk-desc{font-size:12.5px;color:var(--muted);margin-top:2px}
.task-it.done .tk-title{text-decoration:line-through;color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--navy);color:#fff;padding:11px 22px;border-radius:12px;font-size:13.5px;font-weight:600;transition:.25s;z-index:300;box-shadow:var(--shadow-lg);max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:10px}

/* ============ Mobile ============ */
@media(max-width:860px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-105%);box-shadow:var(--shadow-lg)}
  #sidebar.open{transform:none}
  #topbar{display:flex}
  #content{padding:16px 14px 40px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .col{min-width:82vw;width:82vw}
  .grid2{grid-template-columns:1fr}
  .ld-info{grid-template-columns:1fr}
}
/* Nazorat bloki */
.nz-card{border:1px solid var(--red);border-left:4px solid var(--red)}
.nz-sub{font-size:13px;color:var(--muted);margin-bottom:8px}
.nz-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.nz-row:hover{background:var(--red-bg)}
.nz-row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.nz-ph{color:var(--muted);font-size:12.5px;white-space:nowrap}
.nz-age{margin-left:auto;color:var(--red);font-size:12px;white-space:nowrap}
.nz-more{font-size:12.5px;color:var(--blue);cursor:pointer;padding:6px 8px}
.nz-rec{margin-top:10px;padding:9px 10px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-size:12.5px}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="logo"><span class="mono">LH</span><span>Luzzi <span class="lh">Home</span></span></div>
  <div class="logo-sub">Parda Studiyasi</div>
  <nav id="nav"></nav>
  <div class="side-spacer"></div>
  <div class="sync-pill"><div class="dot" id="syncDot"></div><span id="syncTxt">Yuklanmoqda…</span></div>
  <button class="prof-chip" onclick="accountModal()">
    <span class="ava" id="profAva">?</span>
    <span style="text-align:left"><span id="profName">Kirilmagan</span><small id="profRole">kirish</small></span>
  </button>
</aside>

<div id="main">
  <div id="topbar">
    <button class="burger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <div class="logo"><span class="mono" style="width:32px;height:32px;font-size:13px">LH</span><span>Luzzi <span class="lh">Home</span></span></div>
  </div>
  <div id="banner">⚠️ <b>Lokal rejim:</b> ma'lumotlar faqat shu brauzerda. Jamoaviy ishlash uchun Supabase ulanadi (fayl boshidagi SB_URL / SB_KEY).</div>
  <div id="content"></div>
</div>

<div id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script>
/* ==================== SOZLAMALAR ====================
   Supabase ulash: quyidagi 2 qiymatni to'ldiring.

const uid = () => crypto.randomUUID();
const nowISO = () => new Date().toISOString();
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const thisMonth = () => todayISO().slice(0,7);
const monthKey = s => (s||"").slice(0,7);
function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function fm(n){ return "$" + Number(n||0).toLocaleString("en-US"); }
const MONTHS_UZ=["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"];
function fmtDate(s){
  if(!s) return "—";
  const d=new Date(s); if(isNaN(d)) return s;
  const y=d.getFullYear()===new Date().getFullYear()?"":" "+d.getFullYear();
  return d.getDate()+"-"+MONTHS_UZ[d.getMonth()]+y;
}
function timeAgo(s){
  const t = new Date(s).getTime(); if(!t) return "";
  const d = Date.now()-t;
  if(d<60e3) return "hozir";
  if(d<3600e3) return Math.floor(d/60e3)+" daq oldin";
  if(d<86400e3) return Math.floor(d/3600e3)+" soat oldin";
  if(d<7*86400e3) return Math.floor(d/86400e3)+" kun oldin";
  return fmtDate(s);
}
function fmtPhone(p){
  if(!p) return "";
  const d = String(p).replace(/\D/g,"");
  if(d.length===12 && d.startsWith("998")) return "+998 "+d.slice(3,5)+" "+d.slice(5,8)+" "+d.slice(8,10)+" "+d.slice(10);
  if(d.length===9) return "+998 "+d.slice(0,2)+" "+d.slice(2,5)+" "+d.slice(5,7)+" "+d.slice(7);
  return p;
}
function agoISO(days){ const d=new Date(); d.setDate(d.getDate()-days); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDur(sec){
  sec=Math.round(Number(sec)||0);
  const h=Math.floor(sec/3600), m=Math.round((sec%3600)/60);
  if(h) return h+" soat"+(m?" "+m+" daq":"");
  if(m) return m+" daq";
  return sec+" son";
}
function initials(n){ return String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
/* telefonni oxirgi 9 raqamga keltirish (moslashtirish uchun) */
function phone9(s){ const d=String(s||"").replace(/\D/g,""); return d.length>=9 ? d.slice(-9) : d; }
/* yozuv fayl nomidan telefonni ajratish: "...olish 995235550_260624_181214.m4a" */
function callPhone(fname){
  const m=String(fname||"").match(/(\+?\d{6,15})_\d{6}_\d{6}/);
  return m ? phone9(m[1]) : "";
}
/* shu lidga (telefoniga) tegishli yozuvlar — yangi sana tepada */
function leadCalls(l){
  const p=phone9(l&&l.phone); if(!p||p.length<9) return [];
  return visibleCalls().filter(c=>callPhone(c.file_name)===p)

      l.stage===first && ![WON,LOST].includes(l.stage) &&
      new Date(l.created_at).getTime() < cut && !leadCalls(l).length)
    .sort((a,b)=>(a.created_at||"").localeCompare(b.created_at||""));

    try{
      if(!sb){ await loadLib(); sb = window.supabase.createClient(SB_URL, SB_KEY); }

/* ---- realtime ---- */
function applyChange(key, p){
  const arr = DB[key], ev = p.eventType;
  if(ev==="INSERT"){ if(!arr.find(x=>x.id===p.new.id)) key==="leads"?arr.push(p.new):arr.unshift(p.new); if(key==="leads") toast("Yangi lid: "+(p.new.name||"")); }
  else if(ev==="UPDATE"){ const i=arr.findIndex(x=>x.id===p.new.id); if(i>=0) arr[i]=p.new; else arr.unshift(p.new); }
  else if(ev==="DELETE"){ const i=arr.findIndex(x=>x.id===(p.old&&p.old.id)); if(i>=0) arr.splice(i,1); }
  maybeRerender();
}
function subRealtime(){
  sb.channel("lm-rt")
    .on("postgres_changes",{event:"*",schema:"public",table:"leads"}, p=>applyChange("leads",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"clients"}, p=>applyChange("clients",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"activities"}, p=>applyChange("activities",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"tasks"}, p=>applyChange("tasks",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"calls"}, p=>applyChange("calls",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"settings"}, p=>{ if(p.new&&p.new.data){ DB.settings=mergeSettings(p.new.data); maybeRerender(); } })
    .subscribe(st=>{ if(st==="SUBSCRIBED") setSync("on","Supabase — jonli"); });
}

/* ---- smart re-render guard ---- */
function dataSig(){
  return DB.leads.map(l=>l.id+":"+l.stage+":"+(l.updated_at||"")).join("|")
    +"#"+DB.clients.map(c=>c.id+":"+(c.status||"")+":"+(c.monthly||"")).join("|")
    +"#"+DB.tasks.map(t=>t.id+":"+(t.status||"")).join("|")
    +"#"+DB.calls.length+"#"+DB.activities.length;
}
function maybeRerender(force){
  const sig = dataSig();
  if(!force && sig===_lastSig) return;
  const ae = document.activeElement;
  const typing = ae && ["INPUT","TEXTAREA","SELECT"].includes(ae.tagName) && document.getElementById("content").contains(ae);
  if(dragLeadId || typing){ _lastSig=sig; return; }
  render();
}
function render(){ renderNav(); renderPage(); _lastSig=dataSig(); }

function allowedPage(p){ return !p.admin || isAdmin(); }
function renderNav(){
  const activeLeads = visibleLeads().filter(l=>![WON,LOST].includes(l.stage)).length;

function go(p){

function renderPage(){
  const c = document.getElementById("content");
  const scroll = c.scrollTop;
  if(ui.page==="dashboard") c.innerHTML = renderDashboard();
  else if(ui.page==="leads") c.innerHTML = renderLeads();
  else if(ui.page==="tasks") c.innerHTML = renderTasks();
  else if(ui.page==="calls") c.innerHTML = renderCalls();
  else if(ui.page==="clients") c.innerHTML = renderClients();
  else c.innerHTML = renderSettings();

/* ==================== DASHBOARD ==================== */
function renderDashboard(){
  const leads=visibleLeads(), m=thisMonth();
  const active = leads.filter(l=>![WON,LOST].includes(l.stage));
  const newM = leads.filter(l=>monthKey(l.created_at)===m).length;
  const won = leads.filter(l=>l.stage===WON);
  const lost = leads.filter(l=>l.stage===LOST);
  const wonM = won.filter(l=>monthKey(l.updated_at||l.created_at)===m).length;
  const conv = (won.length+lost.length) ? Math.round(won.length/(won.length+lost.length)*100) : null;
  const activeClients = visibleClients().filter(c=>c.status!=="Yakunlangan");
  const mrr = activeClients.reduce((s,c)=>s+Number(c.monthly||0),0);
  const pipeVal = active.reduce((s,l)=>s+Number(l.budget||0),0);
  const overdue = active.filter(l=>l.next_action && l.next_action<=todayISO()).length;

  // funnel
  const maxCnt = Math.max(...STAGES.map(s=>leads.filter(l=>l.stage===s.id).length), 1);
  const funnel = STAGES.map(s=>{
    const n = leads.filter(l=>l.stage===s.id).length;
    return `<div class="fun-row"><div class="fun-name">${s.name}</div>
      <div class="fun-track"><div class="fun-bar" style="width:${Math.max(n/maxCnt*100,n?7:0)}%;background:${s.color}">${n||""}</div></div></div>`;
  }).join("");

  // 6-month chart: yangi vs imzolangan
  const months=[]; const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    months.push({k, lbl:MONTHS_UZ[d.getMonth()],
      a:leads.filter(l=>monthKey(l.created_at)===k).length,
      b:leads.filter(l=>l.stage===WON && monthKey(l.updated_at||l.created_at)===k).length});
  }
  const maxM = Math.max(...months.map(x=>Math.max(x.a,x.b)),1);
  const chart = `<div class="chart">`+months.map(x=>
    `<div class="ch-m"><div class="ch-bars">
      <div class="ch-bar a" style="height:${x.a/maxM*100}%" title="Yangi: ${x.a}"></div>
      <div class="ch-bar b" style="height:${x.b/maxM*100}%" title="Imzolangan: ${x.b}"></div>
    </div><div class="ch-lbl">${x.lbl}</div></div>`).join("")+`</div>
    <div class="legend"><span><i style="background:var(--navy-4)"></i>Yangi lidlar</span><span><i style="background:var(--sky)"></i>Xarid qildi</span></div>`;

  // bugungi qo'ng'iroqlar mini-stat (o'ziniki / admin bo'lsa hammasi)
  const todaySec = visibleCalls().filter(c=>c.rec_date===todayISO()).reduce((s,c)=>s+Number(c.seconds||0),0);
  const nzCount = untouchedLeads().length;

  return `
  <div class="page-head"><h1>Boshqaruv paneli</h1><div class="grow"></div>
    <button class="btn btn-primary" onclick="leadForm()">+ Yangi lid</button></div>
  <div class="stats">
    <div class="stat"><div class="v">${active.length}</div><div class="l">Faol lidlar</div>${overdue?`<div class="d" style="color:var(--red)">⏰ ${overdue} ta kechikkan qadam</div>`:""}</div>
    <div class="stat"><div class="v">${newM}</div><div class="l">Bu oy yangi lid</div></div>
    <div class="stat"><div class="v green">${wonM}</div><div class="l">Bu oy xarid qildi</div></div>
    <div class="stat"><div class="v sky">${fm(pipeVal)}</div><div class="l">Kutilayotgan savdo</div></div>
    <div class="stat"><div class="v green">${fm(mrr)}</div><div class="l">Umumiy savdo</div><div class="d">${activeClients.length} ta faol mijoz</div></div>
    <div class="stat"><div class="v">${conv===null?"—":conv+"%"}</div><div class="l">Xaridga aylanish %</div></div>
    <div class="stat"><div class="v">${fmtDur(todaySec)}</div><div class="l">Bugun gaplashildi</div><div class="d" style="cursor:pointer;color:var(--blue)" onclick="go('calls')">Qo'ng'iroqlar →</div></div>
    <div class="stat"><div class="v" style="color:${nzCount?"var(--red)":"var(--green)"}">${nzCount}</div><div class="l">Tegilmagan lid (24s+)</div>${nzCount?`<div class="d" style="color:var(--red)">qo'ng'iroq kutmoqda</div>`:""}</div>
  </div>
  ${nazoratCard()}
  <div class="grid-2">
    <div class="card"><h3>Sotuv bosqichlari</h3>${funnel}</div>
    <div class="card"><h3>So'nggi 6 oy</h3>${chart}</div>
  </div>`;
}

function filteredLeads(){

    if(ui.fSource && l.source!==ui.fSource) return false;
    if(ui.fService && l.service!==ui.fService) return false;

/* ---- drag & drop (optimistic + rollback) ---- */
function setupDnD(){
  document.querySelectorAll(".lead[draggable]").forEach(el=>{
    el.addEventListener("dragstart", e=>{ dragLeadId=el.dataset.id; el.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
    el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); dragLeadId=null; });
  });
  document.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover", e=>{ e.preventDefault(); col.classList.add("dragover"); });
    col.addEventListener("dragleave", ()=>col.classList.remove("dragover"));
    col.addEventListener("drop", e=>{ e.preventDefault(); col.classList.remove("dragover"); const id=dragLeadId; dragLeadId=null; if(id) stageChange(id, col.dataset.stage); });
  });
}
async function stageChange(id, newStage){
  const l = DB.leads.find(x=>x.id===id);
  if(!l || l.stage===newStage) return;
  if(newStage===LOST) return lostModal(id);
  const old = l.stage;
  l.stage=newStage; l.position=Date.now(); render();          // optimistic
  try{
    await updateLead(id, {stage:newStage, position:l.position}, "Bosqich: "+stageOf(old).name+" → "+stageOf(newStage).name);
    addActivity((l.name||"Lid")+" → "+stageOf(newStage).name);
    if(newStage===WON) convertModal(id);
    else toast(stageOf(newStage).name+" ✓");
  }catch(e){
    console.error(e); l.stage=old; render(); toast("Xato: saqlanmadi","err");
  }
}

/* ==================== TASKS ==================== */
const PRIORITIES = [
  {id:"yuqori", name:"Yuqori", color:"var(--red)"},
  {id:"orta",   name:"O'rta",  color:"var(--amber)"},
  {id:"past",   name:"Past",   color:"var(--muted-2)"},
];
const prOf = id => PRIORITIES.find(p=>p.id===id) || PRIORITIES[1];

async function createTask(data){
  const row = await dbInsert("tasks", data);
  if(!DB.tasks.find(x=>x.id===row.id)) DB.tasks.unshift(row);
  saveLocal();
  addActivity("Yangi vazifa: "+row.title+(row.assigned?" → "+row.assigned:""));
  return row;
}
async function updateTask(id, patch){
  const t = DB.tasks.find(x=>x.id===id); if(!t) return;
  Object.assign(t, patch); saveLocal();
  await dbUpdate("tasks", id, patch);
}
async function deleteTask(id){
  DB.tasks = DB.tasks.filter(x=>x.id!==id); saveLocal();
  await dbDelete("tasks", id);
}
async function toggleTask(id){
  const t = DB.tasks.find(x=>x.id===id); if(!t) return;
  const finishing = t.status==="open";
  const patch = finishing ? {status:"done", completed_at:nowISO()} : {status:"open", completed_at:null};
  const old = {status:t.status, completed_at:t.completed_at};
  Object.assign(t, patch); render();                              // optimistic
  try{
    await dbUpdate("tasks", id, patch); saveLocal();
    if(finishing){ addActivity("Vazifa bajarildi: "+t.title); toast("Bajarildi ✓"); }
  }catch(e){ Object.assign(t, old); render(); toast("Xato: saqlanmadi","err"); }
}

function taskItem(t){
  const done = t.status!=="open";
  const over = !done && t.due && t.due<todayISO();
  const pr = prOf(t.priority);
  const lead = t.lead_id ? DB.leads.find(l=>l.id===t.lead_id) : null;
  return `<div class="task-it${done?" done":""}">
    <button class="tk-check${done?" on":""}" onclick="toggleTask('${t.id}')">✓</button>
    <div class="tk-body" onclick="taskForm('${t.id}')">
      <div class="tk-title">${esc(t.title)}</div>
      ${t.descr?`<div class="tk-desc">${esc(t.descr)}</div>`:""}
      <div class="row" style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">
        <span class="chip" style="color:${pr.color};background:transparent;border:1px solid var(--line)">● ${pr.name}</span>
        ${t.assigned?`<span class="chip owner">${esc(t.assigned)}</span>`:""}
        ${t.due?`<span class="chip${over?" due":""}">📅 ${fmtDate(t.due)}</span>`:""}
        ${lead?`<span class="chip src" onclick="event.stopPropagation();leadDetail('${lead.id}')">🪟 ${esc(lead.name)}</span>`:""}
        ${done&&t.completed_at?`<span class="chip" style="background:var(--green-bg);color:var(--green)">✓ ${timeAgo(t.completed_at)}</span>`:""}
      </div>
    </div>
  </div>`;
}
function renderTasks(){
  const mine = visibleTasks();
  const open = mine.filter(t=>t.status==="open");
  const doneArr = mine.filter(t=>t.status!=="open");

  const overdue = open.filter(t=>t.due && t.due<today).length;

    ? `<select onchange="setF('fTask',this.value)"><option value="">Mas'ul: barchasi</option>${assignees.map(a=>`<option value="${esc(a)}"${a===ui.fTask?" selected":""}>${esc(a)}</option>`).join("")}</select>`

  return `
  <div class="page-head"><h1>Vazifalar</h1><div class="grow"></div>
    <button class="btn btn-primary" onclick="taskForm()">+ Yangi vazifa</button></div>
  <div class="stats">
    <div class="stat"><div class="v">${open.length}</div><div class="l">Ochiq vazifalar</div></div>
    <div class="stat"><div class="v" style="color:${overdue?"var(--red)":"inherit"}">${overdue}</div><div class="l">Kechikkan</div></div>
    <div class="stat"><div class="v sky">${dueToday}</div><div class="l">Bugunga</div></div>
    <div class="stat"><div class="v green">${doneM}</div><div class="l">Bu oy bajarilgan</div></div>
  </div>
  <div class="toolbar">
    <div class="seg">
      <button class="${ui.tView==="open"?"on":""}" onclick="setF('tView','open')">Ochiq (${open.length})</button>
      <button class="${ui.tView==="done"?"on":""}" onclick="setF('tView','done')">Bajarilgan</button>
    </div>
    ${taskFilter}
  </div>
  ${src.length
    ? `<div class="card" style="padding:8px 16px">${src.map(taskItem).join("")}</div>`
    : `<div class="card empty"><div class="big">✅</div><b>${ui.tView==="open"?"Ochiq vazifa yo'q":"Hali bajarilgan vazifa yo'q"}</b></div>`}`;

      : `<input type="hidden" id="tf_assigned" value="${esc(t.assigned||ui.profile)}"><div class="field"><label>Mas'ul</label><input value="${esc(t.assigned||ui.profile)}" disabled style="opacity:.7"></div>`}
    <div class="field"><label>Muhimlik</label><select id="tf_pr">${PRIORITIES.map(p=>`<option value="${p.id}"${p.id===(t.priority||"orta")?" selected":""}>${p.name}</option>`).join("")}</select></div>

    <div class="field"><label>Bog'liq lid</label><select id="tf_lead"><option value="">—</option>${activeLeads.map(l=>`<option value="${l.id}"${l.id===t.lead_id?" selected":""}>${esc(l.name)}${l.company?" ("+esc(l.company)+")":""}</option>`).join("")}</select></div>
  </div>

    ${id?`<button class="btn btn-danger" onclick="doDeleteTask('${id}')">O'chirish</button>`:""}
    <div class="grow"></div>

    <button class="btn btn-primary" onclick="saveTaskForm(${id?`'${id}'`:"null"})">Saqlash</button></div>`);
}
async function saveTaskForm(id){
  const g=x=>document.getElementById(x).value.trim();
  const title=g("tf_title");
  if(!title){ toast("Vazifa nomi kiritilmadi","err"); return; }
  const data={ title, descr:g("tf_desc")||null, assigned:g("tf_assigned")||null,
    priority:g("tf_pr"), due:g("tf_due")||null, lead_id:g("tf_lead")||null };
  try{
    if(id) await updateTask(id, data);
    else { data.status="open"; await createTask(data); }
    closeModal(); render(); toast("Saqlandi ✓");
  }catch(e){ console.error(e); toast("Xato: saqlanmadi","err"); }
}
async function doDeleteTask(id){
  try{ await deleteTask(id); closeModal(); render(); toast("O'chirildi"); }
  catch(e){ toast("Xato","err"); }
}

/* ==================== CALLS ==================== */
async function createCall(data){
  const row = await dbInsert("calls", data);
  if(!DB.calls.find(x=>x.id===row.id)) DB.calls.unshift(row);
  saveLocal();
  return row;
}
function callsInPeriod(days){
  const from = agoISO(days-1);
  return visibleCalls().filter(c=>(c.rec_date||"")>=from);
}
function renderCalls(){
  const days = Number(ui.callsPeriod)||7;
  const rows = callsInPeriod(days);
  const totalSec = rows.reduce((s,c)=>s+Number(c.seconds||0),0);
  const totalCnt = rows.reduce((s,c)=>s+Number(c.cnt||1),0);
  const avg = totalCnt ? totalSec/totalCnt : 0;
  const target = Number(DB.settings.call_target_min)||120;
  const today = todayISO();

  // per-operator aggregation
  const ops = {};
  rows.forEach(c=>{
    const o = ops[c.operator] = ops[c.operator]||{sec:0,cnt:0,today:0,last:"",ppl:{},pctS:0,pctN:0};
    o.sec += Number(c.seconds||0); o.cnt += Number(c.cnt||1);
    const ph=c.phone||callPhone(c.file_name); if(ph && c.answered!==false) o.ppl[ph]=1;
    if(c.script_pct!=null){ o.pctS+=Number(c.script_pct); o.pctN++; }
    if(c.rec_date===today) o.today += Number(c.seconds||0);
    if((c.rec_date||"")>o.last) o.last=c.rec_date;
  });
  const opRows = Object.entries(ops).sort((a,b)=>b[1].sec-a[1].sec).map(([name,o])=>{
    const pct = Math.min(Math.round(o.today/60/target*100),100);
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:9px"><span class="ava" style="background:${avatarGrad(name)};width:30px;height:30px;font-size:11px">${esc(initials(name))}</span><b>${esc(name)}</b></div></td>
      <td>${o.cnt}</td>
      <td><b>${Object.keys(o.ppl).length}</b></td>
      <td><b>${fmtDur(o.sec)}</b></td>
      <td>${fmtDur(o.cnt?o.sec/o.cnt:0)}</td>
      <td>${o.pctN?`<b style="color:${Math.round(o.pctS/o.pctN)>=70?"var(--green)":Math.round(o.pctS/o.pctN)>=40?"var(--amber)":"var(--red)"}">${Math.round(o.pctS/o.pctN)}%</b>`:"—"}</td>
      <td style="min-width:150px">
        <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px"><span>${fmtDur(o.today)}</span><span style="color:var(--muted-2)">${pct}%</span></div>
        <div style="background:var(--bg);border-radius:5px;height:7px"><div style="width:${pct}%;height:100%;border-radius:5px;background:${pct>=100?"var(--green)":pct>=50?"var(--sky)":"var(--amber)"}"></div></div>
      </td>
      <td>${fmtDate(o.last)}</td>
    </tr>`;
  }).join("");

  // 14-day chart (total minutes per day)
  const chartDays=[];
  for(let i=13;i>=0;i--){
    const k=agoISO(i);
    const sec=visibleCalls().filter(c=>c.rec_date===k).reduce((s,c)=>s+Number(c.seconds||0),0);
    chartDays.push({k, lbl:k.slice(8)+"."+k.slice(5,7), min:Math.round(sec/60)});
  }
  const maxMin = Math.max(...chartDays.map(x=>x.min),1);
  const chart = `<div class="chart" style="height:120px">`+chartDays.map(x=>
    `<div class="ch-m"><div class="ch-bars"><div class="ch-bar a" style="height:${x.min/maxMin*100}%;width:70%;max-width:30px" title="${x.lbl}: ${fmtDur(x.min*60)}"></div></div><div class="ch-lbl" style="font-size:9.5px">${x.lbl}</div></div>`).join("")+`</div>`;

  return `
  <div class="page-head"><h1>Qo'ng'iroqlar</h1><div class="grow"></div>
    <div class="seg">
      <button class="${days===1?"on":""}" onclick="setF('callsPeriod',1)">Bugun</button>
      <button class="${days===7?"on":""}" onclick="setF('callsPeriod',7)">7 kun</button>
      <button class="${days===30?"on":""}" onclick="setF('callsPeriod',30)">30 kun</button>
    </div>
    <button class="btn btn-line" onclick="callForm()">+ Qo'lda kiritish</button></div>
  <div class="stats">
    <div class="stat"><div class="v sky">${fmtDur(totalSec)}</div><div class="l">Jami gaplashilgan (${days===1?"bugun":days+" kun"})</div></div>
    <div class="stat"><div class="v">${totalCnt}</div><div class="l">Qo'ng'iroqlar soni</div></div>
    <div class="stat"><div class="v">${fmtDur(avg)}</div><div class="l">O'rtacha davomiylik</div></div>
    <div class="stat"><div class="v green">${target} daq</div><div class="l">Kunlik norma /sotuvchi</div><div class="d">Sozlamalarda o'zgaradi</div></div>
  </div>
  ${rows.length ? `
  <div class="tbl-wrap" style="margin-bottom:16px"><table>
    <thead><tr><th>Sotuvchi</th><th>Qo'ng'iroqlar</th><th>Odamlar</th><th>Jami vaqt</th><th>O'rtacha</th><th>Skript %</th><th>Bugun / norma</th><th>Oxirgi yozuv</th></tr></thead>
    <tbody>${opRows}</tbody></table></div>
  <div class="card"><h3>So'nggi 14 kun — kunlik gaplashuv vaqti</h3>${chart}</div>`
  : `<div class="card empty"><div class="big">📞</div><b>Hali qo'ng'iroq ma'lumoti yo'q</b><br>
     <span style="font-size:13px;line-height:1.7">Sotuvchilar yozuvlari Google Drive'ga tushishi bilan bu yerda avtomatik ko'rinadi.<br>
     Buning uchun <b>Calls Sync</b> Apps Script o'rnatiladi (Supabase ulanganidan keyin).<br>
     Hozircha "+ Qo'lda kiritish" orqali ham yozish mumkin.</span></div>`}`;
}
function callForm(){
  modal(`
  <div class="m-head"><h2>Qo'ng'iroq vaqtini kiritish</h2><button class="m-x" onclick="closeModal()">✕</button></div>
  <div class="grid2">
    <div class="field"><label>Sotuvchi *</label>${isAdmin()?`<select id="cl_op">${selOpts(teamNames(), ui.profile)}</select>`:`<input type="hidden" id="cl_op" value="${esc(ui.profile)}"><input value="${esc(ui.profile)}" disabled style="opacity:.7">`}</div>
    <div class="field"><label>Sana</label><input id="cl_date" type="date" value="${todayISO()}"></div>
  </div>
  <div class="grid2">
    <div class="field"><label>Gaplashilgan (daqiqa) *</label><input id="cl_min" type="number" min="1" placeholder="45"></div>
    <div class="field"><label>Qo'ng'iroqlar soni</label><input id="cl_cnt" type="number" min="1" value="1"></div>
  </div>
  <div class="m-actions"><div class="grow"></div>
    <button class="btn btn-line" onclick="closeModal()">Bekor</button>
    <button class="btn btn-primary" onclick="saveCallForm()">Saqlash</button></div>`);
}
async function saveCallForm(){
  const g=x=>document.getElementById(x).value;
  const min=Number(g("cl_min"));
  if(!min){ toast("Daqiqa kiritilmadi","err"); return; }
  try{
    await createCall({ operator:g("cl_op"), rec_date:g("cl_date")||todayISO(),
      seconds:Math.round(min*60), cnt:Number(g("cl_cnt"))||1, file_name:"qo'lda kiritildi" });
    closeModal(); render(); toast("Saqlandi ✓");
  }catch(e){ console.error(e); toast("Xato: saqlanmadi","err"); }
}

/* ==================== CLIENTS ==================== */
function renderClients(){
  const mine = visibleClients();
  const act = mine.filter(c=>c.status!=="Yakunlangan");
  const mrr = act.reduce((s,c)=>s+Number(c.monthly||0),0);
  const avg = act.length?Math.round(mrr/act.length):0;
  const rows = mine.map(c=>{
    const stopped = c.status==="Yakunlangan";
    return `<tr onclick="clientForm('${c.id}')">
      <td><div style="display:flex;align-items:center;gap:9px"><span class="ava" style="background:${avatarGrad(c.name)};width:30px;height:30px;font-size:11px">${esc(initials(c.name))}</span><div><b>${esc(c.name)}</b>${c.company?`<div style="font-size:11.5px;color:var(--muted)">${esc(c.company)}</div>`:""}</div></div></td>
      <td>${esc(fmtPhone(c.phone))||"—"}</td>
      <td>${esc(c.service||"—")}</td>
      <td><b>${c.monthly?fm(c.monthly):"—"}</b></td>
      <td>${esc(c.owner||"—")}</td>
      <td>${fmtDate(c.start_date)}</td>
      <td><span class="tag" style="background:${stopped?"var(--red-bg)":"var(--green-bg)"};color:${stopped?"var(--red)":"var(--green)"}">${stopped?"Yakunlangan":"Faol"}</span></td>
    </tr>`;
  }).join("");
  return `
  <div class="page-head"><h1>Mijozlar</h1><div class="grow"></div>
    <button class="btn btn-primary" onclick="clientForm()">+ Yangi mijoz</button></div>
  <div class="stats">
    <div class="stat"><div class="v">${act.length}</div><div class="l">Faol mijozlar</div></div>
    <div class="stat"><div class="v green">${fm(mrr)}</div><div class="l">Umumiy savdo</div></div>
    <div class="stat"><div class="v sky">${fm(avg)}</div><div class="l">O'rtacha buyurtma</div></div>
  </div>
  ${mine.length
    ? `<div class="tbl-wrap"><table><thead><tr><th>Mijoz</th><th>Telefon</th><th>Mahsulot</th><th>Buyurtma summasi</th><th>Sotuvchi</th><th>Boshlangan</th><th>Holat</th></tr></thead><tbody>${rows}</tbody></table></div>`
    : `<div class="card empty"><div class="big">🤝</div><b>Hali mijozlar yo'q</b><br><span style="font-size:13px">Lid "Xarid qildi" bosqichiga o'tganda avtomatik mijozga aylantirish taklif qilinadi.</span></div>`}`;
}

/* ==================== SETTINGS ==================== */
function chipsEditor(key, title, hint){
  const items = DB.settings[key]||[];
  return `<div class="card"><h3>${title}</h3>
    <div class="chips">${items.map((v,i)=>`<span class="ch">${esc(v)}<button onclick="rmChip('${key}',${i})">✕</button></span>`).join("")||`<span style="color:var(--muted);font-size:13px">Bo'sh</span>`}</div>
    <div class="add-row"><input id="add_${key}" placeholder="${hint}" onkeydown="if(event.key==='Enter')addChip('${key}')"><button class="btn btn-sky btn-sm" onclick="addChip('${key}')">Qo'shish</button></div>
  </div>`;
}
function addChip(key){
  const inp=document.getElementById("add_"+key);
  const v=inp.value.trim(); if(!v) return;
  if(!DB.settings[key].includes(v)) DB.settings[key].push(v);
  inp.value=""; saveSettings(); render();
}
function rmChip(key,i){
  DB.settings[key].splice(i,1); saveSettings(); render();
}
function saveTarget(){
  const v=Number(document.getElementById("set_target").value);
  if(!v||v<10){ toast("Kamida 10 daqiqa","err"); return; }
  DB.settings.call_target_min=v; saveSettings(); render(); toast("Norma saqlandi ✓");
}

/* ---- jamoa muharriri (rol + PIN) ---- */
function teamEditor(){
  const rows = DB.settings.team.map((m,i)=>`
    <div class="st-row" style="flex-wrap:wrap">
      <span class="ava" style="background:${avatarGrad(m.name)};width:30px;height:30px;font-size:11px;flex-shrink:0">${esc(initials(m.name))}</span>
      <input class="st-name" style="flex:0 0 120px" value="${esc(m.name)}" onchange="tmRen(${i},this.value)" title="Ism (ichki — lid/qo'ng'iroq shu ismga bog'lanadi)">
      <input class="st-name" type="email" style="flex:1;min-width:150px" value="${esc(m.email||"")}" placeholder="email@gmail.com" onchange="tmEmail(${i},this.value)" title="Kirish uchun email">
      <select class="tm-role" onchange="tmRole(${i},this.value)">
        <option value="operator"${m.role==="operator"?" selected":""}>Sotuvchi</option>
        <option value="admin"${m.role==="admin"?" selected":""}>Admin</option>
      </select>
      <input class="tm-pin" type="text" value="${esc(m.pin)}" placeholder="Parol" onchange="tmPin(${i},this.value)" title="Kirish paroli">
      ${(!m.pin||!m.email)?`<span title="${!m.email?"Emailsiz":"Parolsiz"} — kira olmaydi" style="color:var(--red);font-size:15px;flex-shrink:0">⚠️</span>`:""}
      <button class="st-btn st-del" onclick="tmDel(${i})" title="O'chirish">✕</button>
    </div>`).join("");
  return `<div class="card" style="grid-column:1/-1"><h3>Jamoa a'zolari, rollar va parollar</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Kirish <b>email + parol</b> bilan. <b>Ism</b> — ichki (lid egasi, qo'ng'iroq sotuvchisi shu ismga bog'lanadi, o'zgartirmang). <b>Admin</b> hammani ko'radi (yagona panel); <b>sotuvchi</b> faqat o'zinikini. ⚠️ = email yoki parol yo'q → kira olmaydi.</p>
    ${rows}
    <div class="add-row" style="margin-top:10px;flex-wrap:wrap">
      <input id="tm_new_name" style="flex:0 0 120px" placeholder="Ism" onkeydown="if(event.key==='Enter')tmAdd()">
      <input id="tm_new_email" class="st-name" type="email" style="flex:1;min-width:150px" placeholder="email@gmail.com">
      <select id="tm_new_role" class="tm-role"><option value="operator">Sotuvchi</option><option value="admin">Admin</option></select>
      <input id="tm_new_pin" class="tm-pin" type="text" placeholder="Parol">
      <button class="btn btn-sky btn-sm" onclick="tmAdd()">Qo'shish</button>
    </div>
  </div>`;
}
function tmEmail(i,v){ DB.settings.team[i].email=v.trim().toLowerCase(); saveSettings(); render(); }
function tmRen(i,v){ v=v.trim(); if(!v){ render(); return; } DB.settings.team[i].name=v; saveSettings(); render(); }
function tmRole(i,v){
  const t=DB.settings.team;
  if(v!=="admin" && t.filter(m=>m.role==="admin").length<=1 && t[i].role==="admin"){
    toast("Kamida bitta admin qolishi kerak","err"); render(); return;
  }
  t[i].role = v==="admin"?"admin":"operator"; saveSettings(); render();
}
function tmPin(i,v){ DB.settings.team[i].pin=v.trim(); saveSettings(); }
function tmDel(i){
  const t=DB.settings.team, m=t[i];
  if(m.role==="admin" && t.filter(x=>x.role==="admin").length<=1){ toast("Oxirgi adminni o'chirib bo'lmaydi","err"); return; }
  const cnt=DB.leads.filter(l=>l.owner===m.name).length;
  if(cnt && !confirm(`${m.name}da ${cnt} ta lid bor. O'chirilsa ular egasiz qoladi. Davom etilsinmi?`)) return;
  t.splice(i,1); saveSettings(); render(); toast("A'zo o'chirildi");
}
function tmAdd(){
  const name=document.getElementById("tm_new_name").value.trim();
  if(!name){ toast("Ism kiriting","err"); return; }
  if(teamMember(name)){ toast("Bu ism allaqachon bor","err"); return; }
  const email=document.getElementById("tm_new_email").value.trim().toLowerCase();
  const role=document.getElementById("tm_new_role").value;
  const pin=document.getElementById("tm_new_pin").value.trim();
  DB.settings.team.push({name, email, role:role==="admin"?"admin":"operator", pin});
  saveSettings(); render(); toast("A'zo qo'shildi ✓");
}

/* ---- kanban bosqichlari muharriri ---- */
function stagesEditor(){
  const st = DB.settings.stages;
  const rows = st.map((s,i)=>{
    const sys = s.id===WON || s.id===LOST;
    const cnt = DB.leads.filter(l=>l.stage===s.id).length;
    return `<div class="st-row">
      <input type="color" value="${esc(s.color)}" onchange="stColor(${i},this.value)" title="Rang">
      <input class="st-name" value="${esc(s.name)}" onchange="stRen(${i},this.value)">
      <span class="st-cnt">${cnt?cnt+" lid":""}</span>
      ${sys ? `<span class="st-lock" title="Tizim bosqichi — o'chirilmaydi (statistika va mijoz konversiyasi shunga bog'liq)">🔒</span>`
            : `<button class="st-btn" onclick="stMove(${i},-1)" ${i===0?"disabled":""}>↑</button>
               <button class="st-btn" onclick="stMove(${i},1)" ${i>=st.length-3?"disabled":""}>↓</button>
               <button class="st-btn st-del" onclick="stDel(${i})">✕</button>`}
    </div>`;
  }).join("");
  return `<div class="card" style="grid-column:1/-1"><h3>Kanban bosqichlari</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Nomi va rangini o'zgartiring, yangi ustun qo'shing yoki tartibini almashtiring. "${esc(stageOf(WON).name)}" va "${esc(stageOf(LOST).name)}" — tizim bosqichlari (doim oxirida).</p>
    ${rows}
    <div class="add-row" style="margin-top:10px">
      <input type="color" id="st_new_color" value="#d3387a" style="flex:0 0 46px;width:46px;height:38px;padding:3px;border:1px solid var(--line);border-radius:9px;cursor:pointer">
      <input id="st_new_name" placeholder="Yangi bosqich nomi… (masalan: Tikuvda / Montaj kutilmoqda)" onkeydown="if(event.key==='Enter')stAdd()">
      <button class="btn btn-sky btn-sm" onclick="stAdd()">Qo'shish</button>
    </div>
  </div>`;
}
function stRen(i,v){
  v=v.trim(); if(!v){ render(); return; }
  DB.settings.stages[i].name=v; saveSettings(); render();
}
function stColor(i,v){ DB.settings.stages[i].color=v; saveSettings(); render(); }
function stMove(i,dir){
  const st=DB.settings.stages, j=i+dir;
  if(j<0 || j>=st.length-2) return; // tizim bosqichlaridan nariga o'tmaydi
  [st[i],st[j]]=[st[j],st[i]]; saveSettings(); render();
}
function stDel(i){
  const s=DB.settings.stages[i];
  const cnt=DB.leads.filter(l=>l.stage===s.id).length;
  if(cnt){ toast(`Bu bosqichda ${cnt} ta lid bor — avval ularni ko'chiring`,"err"); return; }
  DB.settings.stages.splice(i,1); saveSettings(); render(); toast("Bosqich o'chirildi");
}
function stAdd(){
  const inp=document.getElementById("st_new_name");
  const name=inp.value.trim(); if(!name){ toast("Nom kiriting","err"); return; }
  const color=document.getElementById("st_new_color").value;
  const st=DB.settings.stages;
  st.splice(st.length-2, 0, {id:"st_"+Date.now().toString(36), name, color}); // WON/LOST oldiga
  inp.value=""; saveSettings(); render(); toast("Bosqich qo'shildi ✓");
}

        Rejim: <b>${REMOTE?"Supabase (jamoaviy, jonli sinxron)":"Lokal (faqat shu brauzer)"}</b><br>
        Luzzi Home — Parda Studiyasi CRM · ${new Date().getFullYear()}

/* ==================== MODALS ==================== */
function modal(html, wide){
  const box=document.getElementById("modalBox");
  box.className="modal"+(wide?" wide":"");
  box.innerHTML=html;
  document.getElementById("modalBg").classList.add("show");
  const f=box.querySelector("input,select,textarea"); if(f) setTimeout(()=>f.focus(),40);
}
function closeModal(){ document.getElementById("modalBg").classList.remove("show"); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

const selOpts = (arr,cur) => arr.map(v=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(v)}</option>`).join("");

async function saveLeadForm(id){

  if(!name){ toast("Ism kiritilmadi","err"); return; }
  const data={
    name, company:g("lf_company")||null, phone:g("lf_phone")||null,
    instagram:g("lf_ig").replace(/^@/,"")||null,
    source:g("lf_source"), service:g("lf_service"),

    owner:(isAdmin()?g("lf_owner"):ui.profile)||null, next_action:g("lf_next")||null,
    notes:g("lf_notes")||null,

    if(id){
      const l=DB.leads.find(x=>x.id===id);
      const newStage=document.getElementById("lf_stage").value;

      data.stage=STAGES[0].id;

/* ==================== EXPORT / IMPORT / DEMO ==================== */
function dl(name, content, type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name; a.click();
}
function exportCSV(kind){
  let head, rows;
  if(kind==="leads"){
    head=["Ism","Manzil / obyekt","Telefon","Instagram","Manba","Mahsulot","Summa ($)","Sotuvchi","Bosqich","Keyingi qadam","Bekor sababi","Izoh","Yaratilgan"];
    rows=DB.leads.map(l=>[l.name,l.company,l.phone,l.instagram,l.source,l.service,l.budget,l.owner,stageOf(l.stage).name,l.next_action,l.lost_reason,l.notes,(l.created_at||"").slice(0,10)]);
  }else{
    head=["Ism","Manzil / obyekt","Telefon","Mahsulot","Summa ($)","Sotuvchi","Boshlangan","Holat","Izoh"];
    rows=DB.clients.map(c=>[c.name,c.company,c.phone,c.service,c.monthly,c.owner,c.start_date,c.status,c.notes]);
  }
  const csv="﻿"+[head].concat(rows).map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  dl("luzzi-home-"+kind+"-"+todayISO()+".csv", csv, "text/csv");
}
function exportJSON(){
  dl("luzzi-home-backup-"+todayISO()+".json", JSON.stringify({leads:DB.leads,clients:DB.clients,activities:DB.activities,settings:DB.settings},null,2), "application/json");
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.leads)) throw new Error("format");
      DB.leads=d.leads; DB.clients=d.clients||[]; DB.activities=d.activities||[]; DB.settings=mergeSettings(d.settings);
      saveLocal(); render(); toast("Tiklandi ✓");
    }catch(e){ toast("Fayl formati noto'g'ri","err"); }
  };
  r.readAsText(f);
}

  for(const t of demoTasks){ try{ await createTask(t); }catch(e){} }
  const demoCalls=[];
  const mins=[[38,52,61],[45,30,72],[55,66,41],[20,48,58],[62,35,50]];
  for(let i=4;i>=0;i--) team.forEach((op,j)=>demoCalls.push({operator:op, rec_date:agoISO(i), seconds:(mins[i][j%3]||40)*60, cnt:6+j+i}));
  for(const c of demoCalls){ try{ await createCall(c); }catch(e){} }
  render(); toast("Demo ma'lumotlar qo'shildi");
}
